[package]
name = "pi-remote-control"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[dependencies]
axum = { version = ">=0.7, <0.8", features = ["http1", "ws", "macros"] }
cc = ">=1.0, <1.3"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio", "service"] }
pi-backend-core = { path = "../pi-backend-core" }
rand = ">=0.9, <0.10"
rcgen = { version = ">=0.13, <0.14", default-features = false, features = ["ring"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "=0.23.31", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
subtle = "2"
time = ">=0.3.36, <0.3.37"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "io-util"] }
tokio-rustls = { version = ">=0.26, <0.27", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = ">=0.5, <0.6", features = ["limit", "timeout", "cors"] }
tower = { version = "0.5", features = ["util"] }

# --- MSRV 1.77.2 transitive dependency guards ---
# Keep the Stage 0 dependency closure on edition-2021-compatible releases.
getrandom = ">=0.2, <0.4"
jobserver = ">=0.1.16, <0.1.34"
tempfile = ">=3.10.0, <3.22.0"
zeroize = ">=1.3, <1.9"

[dev-dependencies]
futures-util = "0.3"
serde_json = "1"
tokio-tungstenite = "0.24"
