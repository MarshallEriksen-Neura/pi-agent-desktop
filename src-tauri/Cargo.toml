[package]
name = "pi-desktop"
default-run = "pi-desktop"
version = "0.7.0"
description = "Pi Coding Agent — iOS-inspired desktop client"
authors = ["Pi"]
edition = "2021"
rust-version = "1.77.2"

[features]
remote-control-smoke = []

[[bin]]
name = "remote-control-command-smoke"
path = "src/bin/remote-control-command-smoke.rs"
required-features = ["remote-control-smoke"]

[lib]
name = "pi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Keep the core Tauri crates on their 2025-04-01 compatible release family.
# All declare Rust 1.77.2 and use tauri-utils 2.3.1 APIs.
tauri-build = { version = "=2.1.1", features = [] }
# tauri-winres 0.3.2+ and embed-resource 3.0.3+ can resolve newer TOML stacks;
# these releases retain the edition-2021 toml 0.8 resource pipeline.
tauri-winres = ">=0.3.0, <0.3.2"
embed-resource = ">=3.0.0, <3.0.3"
# cargo_toml 0.22.3 moved to toml 0.9; 0.22.1 uses toml 0.8 and supports
# Rust 1.71 while satisfying tauri-build's ^0.22 requirement.
cargo_toml = "=0.22.1"

[dependencies]
tauri = { version = "=2.4.1", features = ["protocol-asset", "macos-private-api", "tray-icon", "image", "test"] }
# Pinned <2.3.0: dialog 2.3+ requires tauri >=2.6 and pulls tauri-plugin-fs
# 2.5+ which depends on toml 1.x (edition 2024).
tauri-plugin-dialog = "2, <2.3.0"
tauri-plugin-notification = "2, <2.3.0"
tauri-plugin-process = "2, <2.3.0"
# Pinned <2.9.0: updater 2.9+ may pull edition-2024 transitive deps.
tauri-plugin-updater = "2, <2.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
pi-backend-core = { path = "../crates/pi-backend-core" }
pi-remote-control = { path = "../crates/pi-remote-control" }
axum = { version = ">=0.7, <0.8", features = ["http1", "ws", "macros"] }
# model-list fetch (rustls-tls avoids system OpenSSL on Linux builds)
# pinned to a 1.71-compatible patch so it still builds on the 1.77.x toolchain
# `tokio` is not a reqwest feature (it is always a dependency since 0.12), so it
# must not be listed here or resolution fails on newer cargo.
reqwest = { version = "=0.12.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = "=0.24.0"
futures-util = "0.3"
rustls = { version = "=0.23.31", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-util"] }

# --- MSRV 1.77.2 transitive dependency guards ---
# These constraints prevent cargo from resolving edition-2024 / rust-1.85+
# transitive crates that would break `cargo +1.77.2 check --locked`.
# Each upper bound was verified against the crates.io API on 2026-08-05.

# Keep internal Tauri APIs aligned with tauri/tauri-build above. Newer
# tauri-utils 2.7 and tauri-plugin 2.4 also move to the toml 0.9 stack.
tauri-utils = "=2.3.1"
tauri-plugin = "=2.1.1"
# image 0.25.7+ requires Rust 1.85 through its color-management stack.
# Tauri's image feature is compatible with the Rust-1.70 image 0.25.6 API.
image = { version = ">=0.25.0, <0.25.7", default-features = false }
# cargo_metadata 0.19.1+ requires Rust 1.78; 0.19.0 keeps the same API range
# used by tauri-utils while supporting Rust 1.73.
cargo_metadata = ">=0.19.0, <0.19.1"
# cargo-platform 0.1.9 requires Rust 1.78; cargo_metadata accepts 0.1.8,
# which supports Rust 1.73.
cargo-platform = ">=0.1.2, <0.1.9"
# zip 4.3+ requires Rust 1.82. The updater accepts zip ^4 and uses it without
# default features, so 4.2 retains the same integration surface on Rust 1.77.
zip = { version = ">=4.0.0, <4.3.0", default-features = false }
# hyper-rustls 0.27.8+ requires Rust 1.85. Reqwest 0.12 accepts 0.27.7,
# which supports Rust 1.71; feature selection remains owned by reqwest.
hyper-rustls = { version = ">=0.27.0, <0.27.8", default-features = false }
# unicode-segmentation 1.13+ requires Rust 1.85; the current consumers accept
# the compatible 1.12 API.
unicode-segmentation = ">=1.10.0, <1.13.0"
# notify-rust 4.18 requires Rust 1.89; the notification plugin's ^4.11
# requirement is fully satisfied by 4.17, which supports Rust 1.63.
notify-rust = ">=4.11.0, <4.18.0"
# time >=0.3.46 uses edition 2024 (rust 1.88). 0.3.45 is the last edition-2021
# release that also satisfies plist 1.7 (^0.3.30) and serde_with 3.12 (~0.3.36).
time = ">=0.3.36, <0.3.37"
# uuid >=1.12 depends on getrandom 0.4 (edition 2024, rust 1.85).
# uuid 1.11 uses getrandom ^0.2 (edition 2021, compatible).
uuid = ">=1.0.0, <1.12.0"
# tempfile >=3.22 depends on getrandom >=0.3.0 <0.5 which resolves to getrandom
# 0.4.x (edition 2024, rust 1.85). tempfile 3.21 uses getrandom ^0.3.0 only
# (edition 2021, rust 1.63, compatible).
tempfile = ">=3.10.0, <3.22.0"
# serde_with >=3.13 requires time ~0.3.47 (edition 2024).
# serde_with 3.12 requires time ~0.3.36 (edition 2021, compatible).
serde_with = ">=3.0.0, <3.13.0"
# plist >=1.8 declares rust_version 1.88 and requires time ^0.3.47.
# plist 1.7 declares rust_version 1.68 and requires time ^0.3.30.
plist = ">=1.5.0, <1.8.0"
# proc-macro-crate >=3.3 requires toml_edit >=0.23 which pulls toml_datetime 1.x /
# toml_write (edition 2024, rust 1.85) via the Android/Linux-only num_enum and
# zbus chains. 3.2.0 uses toml_edit ^0.22.20 (edition 2021, compatible).
proc-macro-crate = ">=1.0.0, <3.3.0"
# quinn-proto >=0.11.12 depends on rand 0.10 / getrandom 0.4 (edition 2024).
# It is reqwest's optional HTTP/3 chain, which stays locked even when disabled,
# and `cargo check --locked` still downloads it. 0.11.11 uses rand ^0.9
# (edition 2021, MSRV 1.63, compatible).
quinn-proto = ">=0.11.0, <0.11.12"
cc = ">=1.0.0, <1.3.0"
jobserver = ">=0.1.16, <0.1.34"
zeroize = ">=1.3.0, <1.9.0"
# idna-adapter 1.1 adds a generated Unicode mapping build script, while 1.2+
# also raises the MSRV. idna 1.x accepts the build-script-free 1.0 release.
idna_adapter = ">=1.0.0, <1.1.0"
# indexmap 2.12+ requires Rust 1.82; 2.11.4 supports Rust 1.63.
indexmap = ">=2.0.0, <2.12.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
